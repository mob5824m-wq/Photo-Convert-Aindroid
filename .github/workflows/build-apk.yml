name: Build Pixel Photo NAS APK & Run Tests

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-server-engine:
    name: Python NAS Server & Converter Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest -v

  build-android-apk:
    name: Build Signed Pixel 1–5 Android APK (API 26–34)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Sync Shared Web UI into APK Assets
        run: |
          mkdir -p android-app/app/src/main/assets/webui
          cp webui/index.html webui/styles.css webui/app.js android-app/app/src/main/assets/webui/

      - name: Generate V1+V2 Release Keystore for Direct Pixel Installation
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/pixelnas-release.keystore" \
            -alias pixelnas \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pixelnas2026 \
            -keypass pixelnas2026 \
            -dname "CN=PixelPhotoNAS, OU=MobileNAS, O=PhotoConvertAndroid, L=Kitchener, ST=ON, C=CA"

      - name: Run Android Unit Tests & Build Signed Release + Debug APKs
        working-directory: android-app
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pixelnas-release.keystore
          KEYSTORE_PASSWORD: pixelnas2026
          KEY_ALIAS: pixelnas
          KEY_PASSWORD: pixelnas2026
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon > "$RUNNER_TEMP/gradle.log" 2>&1; then
            cat "$RUNNER_TEMP/gradle.log"
            ERR_SUMMARY=$(grep -E "(^e: |FAILURE:|What went wrong:|^\* |> Task .* FAILED|Caused by:|Error:)" "$RUNNER_TEMP/gradle.log" | tail -n 25 | tr '\n' ' | ')
            echo "::error title=Gradle Failure::$ERR_SUMMARY"
            exit 1
          fi
          cat "$RUNNER_TEMP/gradle.log" | tail -n 30

      - name: Prepare Named Installable APKs
        run: |
          mkdir -p dist-apk
          cp android-app/app/build/outputs/apk/release/app-release.apk dist-apk/PixelPhotoNAS-v1.1.0-Pixel1to5-Signed.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist-apk/PixelPhotoNAS-v1.1.0-Debug.apk
          INFO=$(ls -lh dist-apk/ | tr '\n' ' ')
          echo "::notice title=Built Signed APKs::$INFO"

      - name: Upload Installable Pixel 1–5 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelPhotoNAS-Pixel1-to-Pixel5-APK
          path: dist-apk/*.apk
          retention-days: 90

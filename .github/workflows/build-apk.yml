name: Build Pixel Photo NAS & Household Samba APKs

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixel-photo-nas-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-server-engine:
    name: Python NAS, Samba SMB2 & Versioning Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest -v

  build-android-apk:
    name: Build Signed Server APK + Household Samba Client APK & Release
    needs: test-server-engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Fetch All Release Tags & Resolve Rollover Version (v1.0.0 -> v1.0.9 -> v1.1.0 -> v2.0.0)
        id: ver
        run: |
          git fetch --tags --force
          python3 -m server.versioning --github-output "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Sync Shared Web UI into Server APK Assets & Write VERSION
        run: |
          echo "${{ steps.ver.outputs.version }}" > VERSION
          mkdir -p android-app/app/src/main/assets/webui
          cp -r webui/. android-app/app/src/main/assets/webui/

      - name: Verify Persistent V1+V2 Release Keystore
        run: |
          keytool -list \
            -keystore android-app/keystore/pixelnas-release.p12 \
            -storetype PKCS12 \
            -storepass pixelnas2026

      - name: Build & Test APK #1 — Pixel Photo NAS Server (android-app)
        working-directory: android-app
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest assembleDebug assembleRelease \
            -PappVersionName="${{ steps.ver.outputs.version }}" \
            -PappVersionCode="${{ steps.ver.outputs.version_code }}" \
            --no-daemon > "$RUNNER_TEMP/gradle-server.log" 2>&1; then
            cat "$RUNNER_TEMP/gradle-server.log"
            ERR_SUMMARY=$(grep -E "(^e: |FAILURE:|What went wrong:|^\* |> Task .* FAILED|Caused by:|Error:)" "$RUNNER_TEMP/gradle-server.log" | tail -n 25 | tr '\n' ' | ')
            echo "::error title=Server APK Gradle Failure::$ERR_SUMMARY"
            exit 1
          fi
          cat "$RUNNER_TEMP/gradle-server.log" | tail -n 30

      - name: Build & Live-Samba-Test APK #2 — Household Samba Android App (household-app)
        run: |
          set -o pipefail
          python3 -c '
          import signal, sys, tempfile, time
          from pathlib import Path
          from PIL import Image
          from server.config import SettingsManager
          from server.database import HistoryDatabase
          from server.watcher import PipelineWorker
          from server.smb_server import EmbeddedSmbServer

          Image.new("RGB", (5200, 3800), color=(20, 148, 136)).save(sys.argv[2], format="JPEG", quality=90)
          tmp = tempfile.TemporaryDirectory()
          mgr = SettingsManager(base_dir=Path(tmp.name))
          mgr.update({"smb_port": 14445, "ftp_enabled": False})
          db = HistoryDatabase(mgr.db_file)
          worker = PipelineWorker(mgr, db)
          smb = EmbeddedSmbServer(mgr, worker)
          worker.start()
          smb.start_or_reload()
          Path(sys.argv[1]).write_text(str(smb.bound_port))
          signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
          while True:
              time.sleep(0.5)
          ' "$RUNNER_TEMP/smb_port.txt" "$RUNNER_TEMP/sample_19mp.jpg" &
          SMB_PID=$!
          trap "kill $SMB_PID 2>/dev/null || true" EXIT
          for _ in $(seq 1 30); do
            [ -s "$RUNNER_TEMP/smb_port.txt" ] && break
            sleep 0.2
          done
          LIVE_PORT=$(cat "$RUNNER_TEMP/smb_port.txt")
          echo "Live NAS Samba server active on 127.0.0.1:${LIVE_PORT}"

          cd household-app
          if ! LIVE_SMB_TEST_PORT="$LIVE_PORT" LIVE_SMB_TEST_JPEG="$RUNNER_TEMP/sample_19mp.jpg" gradle testDebugUnitTest assembleDebug assembleRelease \
            -PappVersionName="${{ steps.ver.outputs.version }}" \
            -PappVersionCode="${{ steps.ver.outputs.version_code }}" \
            --no-daemon > "$RUNNER_TEMP/gradle-household.log" 2>&1; then
            cat "$RUNNER_TEMP/gradle-household.log"
            ERR_SUMMARY=$(grep -E "(^e: |FAILURE:|What went wrong:|^\* |> Task .* FAILED|Caused by:|Error:)" "$RUNNER_TEMP/gradle-household.log" | tail -n 15 | tr '\n' ' | ')
            JUNIT_XML=$(grep -R -h -A 12 "<failure" app/build/test-results/ 2>/dev/null | head -n 20 | tr '\n' ' | ' || true)
            echo "::error title=Household APK Gradle Failure::$ERR_SUMMARY :: $JUNIT_XML"
            exit 1
          fi
          cat "$RUNNER_TEMP/gradle-household.log" | tail -n 30

      - name: Prepare Versioned Installable Server & Household Samba APKs
        run: |
          mkdir -p dist-apk
          VER="${{ steps.ver.outputs.version }}"
          cp android-app/app/build/outputs/apk/release/app-release.apk "dist-apk/PixelPhotoNAS-v${VER}-Pixel1to5-Signed.apk"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "dist-apk/PixelPhotoNAS-v${VER}-Debug.apk"
          cp household-app/app/build/outputs/apk/release/app-release.apk "dist-apk/PixelPhotoNAS-Household-v${VER}-SambaClient-Signed.apk"
          cp household-app/app/build/outputs/apk/debug/app-debug.apk "dist-apk/PixelPhotoNAS-Household-v${VER}-Debug.apk"
          INFO=$(ls -lh dist-apk/ | tr '\n' ' ')
          echo "::notice title=Built Signed Server + Household Samba APKs (${{ steps.ver.outputs.tag }}, code ${{ steps.ver.outputs.version_code }})::$INFO"

      - name: Upload Installable Server + Household Samba APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelPhotoNAS-Server-and-Household-Samba-APKs
          path: dist-apk/*.apk
          retention-days: 90

      - name: Tag Merge Release & Publish GitHub Release on Merge to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.version }}"
          CODE="${{ steps.ver.outputs.version_code }}"
          PREV="${{ steps.ver.outputs.prev_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet VERSION; then
            git add VERSION
            git commit -m "chore(release): ${TAG} (versionCode ${CODE}) [skip ci]"
            git push origin HEAD:main || git reset --hard HEAD~1
          fi

          git tag -a "${TAG}" -m "Pixel Photo NAS & Household Samba ${TAG} (versionCode ${CODE})"
          git push origin "${TAG}"

          NOTES="Automated merge build for **Pixel Photo NAS & Household Samba Client ${TAG}** (\`versionName = ${VER}\`, \`versionCode = ${CODE}\`). Includes both \`PixelPhotoNAS-v${VER}-Pixel1to5-Signed.apk\` (Closet Pixel 1–5 NAS + Samba Server) and \`PixelPhotoNAS-Household-v${VER}-SambaClient-Signed.apk\` (Family Phones Direct Samba Share App)."
          if [ -n "${PREV}" ]; then
            NOTES="${NOTES} Bumped automatically from \`${PREV}\`."
          fi

          gh release create "${TAG}" dist-apk/*.apk \
            --title "Pixel Photo NAS & Household Samba ${TAG}" \
            --notes "${NOTES}" \
            --generate-notes
